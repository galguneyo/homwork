name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [claude/eager-heisenberg-4wulfm]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The dataset is the source of truth. Rebuilding here and diffing against
      # what is committed means a stale dashboard can never reach the live site.
      - name: Rebuild dashboard from the dataset
        run: node scripts/build-dashboard.js

      - name: Fail if the committed dashboard is stale
        run: git diff --exit-code -- dashboard/index.html

      - name: Assemble site
        run: |
          mkdir -p _site/dashboard
          cp index.html _site/index.html
          cp dashboard/index.html _site/dashboard/index.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
